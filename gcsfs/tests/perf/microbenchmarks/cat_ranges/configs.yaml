common:
  bucket_types:
    - "regional"
    - "zonal"
    - "hns"
  file_sizes_mb:
    - 1024 # 1 GB
  num_ranges_list:
    - 200
  batch_sizes:
    - 64
  max_gaps:
    - "auto" # adaptive gap derived per file from requested chunk sizes
    - null # coalescing disabled (baseline)
    - 0 # coalesce contiguous ranges only
  rounds: 3

scenarios:
  - name: "cat_ranges_seq"
    pattern: "seq"
    files: 1
    chunk_sizes_mb:
      - [1] # 1 MB uniform

  - name: "cat_ranges_rand"
    pattern: "rand"
    files: 1
    chunk_sizes_mb:
      - [1] # 1 MB uniform

  - name: "cat_ranges_mixed_sizes"
    pattern: "rand"
    files: 1
    chunk_sizes_mb:
      - [0.0625, 1, 4, 16] # 64KB, 1MB, 4MB, 16MB varied in one call

  - name: "cat_ranges_multi_file"
    pattern: "rand"
    files: 5
    chunk_sizes_mb:
      - [1]

  - name: "cat_ranges_batch_size_sweep"
    pattern: "rand"
    files: 1
    num_ranges_list:
      - 200
    batch_sizes:
      - 16
      - 64
      - 128
    chunk_sizes_mb:
      - [1]

  - name: "cat_ranges_large_file_large_ranges"
    pattern: "rand"
    files: 1
    file_sizes_mb:
      - 10240 # 10 GB
    num_ranges_list:
      - 1000
    batch_sizes:
      - 64
    chunk_sizes_mb:
      - [0.0625, 1, 4, 16]

  # Full-object reads issued as a single range. These bound the small-object
  # end of the workload: there is nothing to coalesce, so they measure the
  # floor that the coalesced multi-range scenarios above are working toward.
  - name: "cat_ranges_full_file_single_range_5mb"
    pattern: "seq"
    files: 1
    file_sizes_mb:
      - 5
    num_ranges_list:
      - 1
    chunk_sizes_mb:
      - [5] # single range spanning the whole 5 MB file

  - name: "cat_ranges_full_file_single_range_16mb"
    pattern: "seq"
    files: 1
    file_sizes_mb:
      - 16
    num_ranges_list:
      - 1
    chunk_sizes_mb:
      - [16] # single range spanning the whole 16 MB file
