common:
  rounds: 3
  seq_len: 2048
  batch_size: 8
  baseline:
    fmt: "text_parquet"
    file_count: 1024
    rows_per_file: 3600
    # Keeps uncompressed pretokenized Parquet row groups below about 30 MB.
    row_group_size: 1800
    access: "shuffled"
    num_workers: 16
    prefetch_factor: 2
    split_by_node: true
    world_size: 8
    shuffle_buffer_size: 10000
    # Match Hugging Face Datasets' default input-shard grouping.
    max_buffer_input_shards: 10

scenarios:
  - name: "read"
    scenario: "read"
    variants: []
